<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="War Room">
  <defs>
    <linearGradient id="sweep" x1="64" y1="64" x2="64" y2="18" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#10B981" stop-opacity="0"/>
      <stop offset="1" stop-color="#10B981" stop-opacity="0.45"/>
    </linearGradient>
  </defs>
  <rect x="2" y="2" width="124" height="124" rx="28" fill="#121413" stroke="#2D3630" stroke-width="2"/>
  <!-- radar sweep -->
  <path d="M64 64 L64 18 A46 46 0 0 1 96.5 31.5 Z" fill="url(#sweep)"/>
  <!-- outer ring and range ring -->
  <circle cx="64" cy="64" r="46" fill="none" stroke="#10B981" stroke-width="5"/>
  <circle cx="64" cy="64" r="29" fill="none" stroke="#10B981" stroke-width="2.5" stroke-opacity="0.45"/>
  <!-- crosshair ticks -->
  <g stroke="#10B981" stroke-width="5" stroke-linecap="round">
    <line x1="64" y1="10" x2="64" y2="18"/>
    <line x1="64" y1="110" x2="64" y2="118"/>
    <line x1="10" y1="64" x2="18" y2="64"/>
    <line x1="110" y1="64" x2="118" y2="64"/>
  </g>
  <!-- keyhole: the device keeps the secrets -->
  <circle cx="64" cy="57" r="10" fill="#E5E7EB"/>
  <path d="M58.5 62 H69.5 L73 82 H55 Z" fill="#E5E7EB"/>
  <!-- the threat: one stress point on the ring -->
  <circle cx="96.5" cy="31.5" r="8" fill="#F97316"/>
</svg>
